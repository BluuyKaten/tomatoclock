[package]
name = "tomatoclock"
version = "0.1.0"
authors = ["BluuyKaten <1808660458@qq.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.8.0-alpha.0", features = [] }
tokio = { version = "1", features = ["time"] }
rodio = { version = "0.20", features = ["symphonia-isomp4", "symphonia-aac"] }
chrono = "0.4"
rfd = "0.15"
rusqlite = { version = "0.40.1", features = ["bundled"] }
symphonia = { version = "0.5.4", features = ["mp3", "isomp4", "aac", "pcm", "wav", "flac", "vorbis", "adpcm", "alac"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
