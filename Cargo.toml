[package]
name = "tomatoclock"
version = "0.1.0"
authors = ["BluuyKaten <1808660458@qq.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.8.0-alpha.0", features = [] }
tokio = { version = "1", features = ["time"] }
rodio = "0.20"
chrono = "0.4"
rfd = "0.15"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
